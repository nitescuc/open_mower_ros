kld_err: 0.05
kld_z: 0.99
odom_alpha1: 0.05
odom_alpha2: 0.05
odom_alpha3: 0.03
odom_alpha4: 0.03
odom_alpha5: 0.05

laser_z_hit: 0.7
laser_z_rand: 0.3
laser_z_max: 0.05

laser_z_short: 0.1
laser_sigma_hit: 0.4
laser_lambda_short: 0.1
